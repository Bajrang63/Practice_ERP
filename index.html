<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRACTICE ERP</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#172638;background:#f3f6fa}aside{position:fixed;width:235px;height:100vh;background:#13263d;color:white;padding:22px 12px;overflow:auto}aside h2{margin:0 10px 4px}aside small{color:#aabbd0;margin:10px}nav{margin-top:24px}nav button{display:block;width:100%;text-align:left;background:none;color:#c9d7e8;border:0;padding:10px 13px;border-radius:7px}nav button:hover,nav button.active{background:#284967;color:white}main{margin-left:235px;padding:30px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:26px;margin:0}h2{font-size:19px}button{cursor:pointer;border:0;border-radius:7px;padding:10px 15px;background:#176b70;color:white;font-weight:600}button.secondary{background:#e4ebf1;color:#20354c}button:disabled{opacity:.5}input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;background:white;font:inherit}label{display:block;color:#526477;font-size:12px;font-weight:600}label input,label select{margin-top:5px;color:#172638}.panel,.metric{background:white;border:1px solid #dce5ee;border-radius:12px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.metric strong{display:block;font-size:26px;margin-top:12px}.metric small{color:#63768a}form .grid{margin-bottom:15px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px;border-bottom:1px solid #e4eaf0}th{font-size:11px;text-transform:uppercase;color:#64748b;background:#f7f9fc}.scroll{overflow:auto}.muted{color:#64748b}.tag{background:#e2f3ee;color:#176b58;padding:5px 8px;border-radius:6px}.error{color:#b91c1c}#login{max-width:400px;margin:12vh auto;padding:30px}#login input{margin:12px 0}#app[hidden],#login[hidden]{display:none} @media(max-width:700px){aside{position:static;width:auto;height:auto}nav{display:flex;overflow:auto;margin-top:10px}nav button{width:auto;white-space:nowrap}main{margin:0;padding:15px}}@media print{aside,header,form,button,.no-print{display:none!important}main{margin:0;padding:0}}
aside{background:#101e35;width:248px}main{margin-left:248px;max-width:1600px}aside h2{letter-spacing:-.8px;color:#fff}nav button{margin:3px 0}nav button.active{background:#167c80;box-shadow:0 3px 12px #0002}header{border-bottom:1px solid #dce5ee;padding-bottom:18px}body{background:#f4f7fb}.metric{border-top:3px solid #15958e;box-shadow:0 4px 16px #152c4410}.panel{box-shadow:0 4px 16px #152c4408}.toolbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}.toolbar input{max-width:380px}.track{height:12px;background:#e5edf2;border-radius:12px;overflow:hidden}.track div{height:100%;background:#15958e}tbody tr:hover{background:#f0f8fa}input:focus,select:focus{outline:2px solid #15958e;outline-offset:1px}@media(max-width:700px){aside{width:auto}main{margin:0}.toolbar{flex-wrap:wrap}header{flex-wrap:wrap;gap:12px}}@media print{.toolbar{display:none}}</style><body><section id="login" class="panel"><h1>PRACTICE ERP</h1><p>Employee sign in</p><input id="username" placeholder="Username" value="admin"><input id="password" type="password" placeholder="Password"><button onclick="login()">Sign in</button><p id="loginError" class="error"></p></section><div id="app" hidden><aside><h2>PRACTICE ERP</h2><small>Web Application · Training</small><nav id="nav"></nav></aside><main><header><div><div class="muted">WORKSPACE / OPERATIONS</div><h1 id="heading"></h1></div><span id="identity" class="tag"></span><button onclick="logout()">Sign out</button></header><div id="notice"></div><div class="toolbar"><input id="search" placeholder="Search records on this page" oninput="filterRows(this.value)"><span class="tag">CLOUD TRAINING PREVIEW</span></div><div id="view"></div></main></div><script>
const money=n=>Number(n||0).toLocaleString('en-IN',{style:'currency',currency:'INR'}), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), today=()=>new Date().toISOString().slice(0,10);let S,rev=0,page='Dashboard',busy=false;
const schemas={Organisation:['name','gstin','address','email'],Branches:['name','code'],Warehouses:['name','branch','rack','shelf'],Suppliers:['name','phone','gstin'],Products:['name','sku','brand','category','unit','variant','rate:number','gst:number'],Customers:['name','phone','gstin','address'],CRM:['name','phone','source','owner','followup:date','status'],HR:['name','department','designation','status'],Users:['name','role','status'],Production:['name','output','quantity:number','status'],Kits:['name','components','status']};
Object.assign(schemas,{Attendance:['name','date:date','status','hours:number'],Payroll:['name','month','gross:number','deductions:number','status'],'Supplier Payments':['name','purchase_reference','amount:number','date:date','mode'],Advances:['name','customer_reference','amount:number','date:date'],Refunds:['name','credit_reference','amount:number','date:date','status']});
const pages=['Dashboard','Organisation','Branches','Warehouses','Suppliers','Products','Kits','Purchase','Inventory','CRM','Customers','Quotation','Sales Orders','Invoices','Payments','Installments','Returns','Production','HR','Users','Reports','Attendance','Payroll','Supplier Payments','Advances','Refunds','Audit'];
function seed(){let s={};for(let p of pages)s[p]=[];s.Organisation=[{id:'ORG-1',name:'Practice Safety Services',address:'Pune, Maharashtra'}];s.Branches=[{id:'B1',name:'Head Office',code:'B1'},{id:'B2',name:'Branch 2',code:'B2'},{id:'B3',name:'Branch 3',code:'B3'}];s.Warehouses=s.Branches.flatMap((b,i)=>Array.from({length:i===2?2:3},(_,j)=>({id:b.id+'-W'+(j+1),name:'Warehouse '+(j+1),branch:b.id,rack:'A',shelf:'S1'})));s.Products=[{id:'P1',name:'Safety Helmet',sku:'HEL-001',unit:'Piece',rate:300,gst:18},{id:'P2',name:'Safety Shoes',sku:'SH-BLK-07',unit:'Pair',variant:'Black / 7',rate:800,gst:18},{id:'P3',name:'Safety Gloves',sku:'GLV-001',unit:'Pair',rate:100,gst:18}];s.Suppliers=[{id:'SUP-1',name:'ABC Safety Industries'}];s.Customers=[{id:'CUS-1',name:'ABC Manufacturing'}];s.Inventory=[{id:'ST-1',product:'P1',warehouse:'B1-W1',qty:120},{id:'ST-2',product:'P2',warehouse:'B1-W1',qty:50},{id:'ST-3',product:'P3',warehouse:'B1-W1',qty:300}];return s}
async function login(){try{await api("login","POST",{username:username.value,password:password.value});password.value="";await load()}catch(e){loginError.textContent=e.message}}
async function api(action,method="GET",data){const r=await fetch("/api/erp?action="+action,{method,credentials:"same-origin",headers:{"Content-Type":"application/json"},...(data?{body:JSON.stringify(data)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j}
let actor;
async function load(){const j=await api("state");S=j.data||seed();rev=j.revision;actor=j.user;identity.textContent=actor.username+" · "+actor.role;document.querySelector("#login").hidden=true;app.hidden=false;render()}
async function save(){S.Audit.push({actor:actor.username,date:new Date().toISOString(),modules:page});const j=await api("state","PUT",{data:S,revision:rev});rev=j.revision;render()}
function id(p){return p+'-'+crypto.randomUUID().slice(0,8).toUpperCase()}function name(p,i){return S[p].find(x=>x.id===i)?.name||i}function stock(p,w){return S.Inventory.find(x=>x.product===p&&x.warehouse===w)}function move(p,w,q){let x=stock(p,w);if((x?.qty||0)+q<0)throw Error('Insufficient stock');if(!x){x={id:id('ST'),product:p,warehouse:w,qty:0};S.Inventory.push(x)}x.qty+=q}
function field(k,opts){let [n,t]=k.split(':');return `<label>${esc(n.replaceAll('_',' '))}${opts?`<select name="${n}" required>${opts.map(o=>`<option value="${esc(o.id)}">${esc(o.name||o.id)}</option>`).join('')}</select>`:`<input name="${n}" type="${t||'text'}" ${t==='number'?'step="any" min="0"':''} ${n==='name'?'required':''}>`}</label>`}function form(fields,action,label='Save record'){return `<form class="panel" onsubmit="submitForm(event,'${action}')"><div class="grid">${fields.join('')}</div><button>${label}</button></form>`}function table(rows,cols,actions){return `<div class="panel scroll"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}${actions?'<th>Actions</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}${actions?`<td>${actions(r)}</td>`:''}</tr>`).join('')}</tbody></table>${rows.length?'':'<p class="muted">No records yet.</p>'}</div>`}function btn(label,act,i){return `<button class="secondary" onclick="action('${act}','${i}')">${label}</button>`}function balance(i){let x=S.Invoices.find(x=>x.id===i);return Math.round(((x?.total||0)-S.Payments.filter(p=>p.invoice===i).reduce((a,p)=>a+p.amount,0)-S.Returns.filter(p=>p.invoice===i).reduce((a,p)=>a+p.amount,0))*100)/100}
async function logout(){try{await api("logout","POST");location.reload()}catch(e){alert(e.message)}}
function filterRows(q){document.querySelectorAll("#view tbody tr").forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q.toLowerCase()))}
function render(){heading.textContent=page;nav.innerHTML=pages.map(p=>`<button class="${p===page?'active':''}" onclick="page='${p}';render()">${p}</button>`).join('');let h='';if(page==='Dashboard'||page==='Reports'){let metrics=[['Invoiced sales',money(S.Invoices.reduce((a,x)=>a+x.total,0))],['Outstanding',money(S.Invoices.reduce((a,x)=>a+balance(x.id),0))],['Payments received',money(S.Payments.reduce((a,x)=>a+x.amount,0))],['Products',S.Products.length],['CRM leads',S.CRM.length],['Purchase value',money(S.Purchase.reduce((a,x)=>a+x.total,0))]];h=`<div class="grid">${metrics.map(m=>`<div class="metric"><small>${m[0]}</small><strong>${m[1]}</strong></div>`).join('')}</div><h2>Recent sales orders</h2>`+table(S['Sales Orders'],['id','customer','total','status']);if(page==='Reports')h+=`<button onclick="exportData()">Export all records (JSON)</button>`}
else if(page==='Users'){h='<p class="muted">Training user records only. No real authentication.</p>'+form(schemas.Users.map(k=>field(k)),'master')+table(S.Users,['name','role','status'])}
else if(page==='Audit'){h=table(S.Audit,['actor','date','modules'])}
else if(schemas[page]){h=form(schemas[page].map(k=>field(k,k==='branch'?S.Branches:null)),'master')+table(S[page],['id',...schemas[page].map(k=>k.split(':')[0])],page==='CRM'?r=>btn('Convert to customer','convert',r.id):null);if(['Users','Production','Kits','HR'].includes(page))h='<p class="muted">Master records only in this release; advanced workflows are not enabled.</p>'+h}
else if(['Purchase','Quotation','Sales Orders'].includes(page)){let party=page==='Purchase'?'supplier':'customer';h=form([field(party,S[party==='supplier'?'Suppliers':'Customers']),field('product',S.Products),field('warehouse',S.Warehouses),field('qty:number'),field('rate:number'),field('discount:number'),field('gst:number')],'trade','Create '+page).replace('<button>', '<div id="extraLines"></div><button type="button" class="secondary" onclick="addLine()">Add product line</button> <button>')+table(S[page],['id',party,'product','warehouse','qty','rate','total','status'],r=>page==='Purchase'&&r.status==='Ordered'?btn('Receive','receive',r.id):page==='Quotation'&&r.status==='Draft'?btn('Approve','approve',r.id)+' '+btn('Reject','reject',r.id):page==='Quotation'&&r.status==='Approved'?btn('Create order','order',r.id):page==='Sales Orders'&&r.status==='Confirmed'?btn('Dispatch','dispatch',r.id):page==='Sales Orders'&&r.status==='Dispatched'?btn('Invoice','invoice',r.id):'')}
else if(page==='Inventory'){h=form([field('product',S.Products),field('from',S.Warehouses),field('to',S.Warehouses),field('qty:number')],'transfer','Transfer stock')+table(S.Inventory.map(x=>({...x,product:name('Products',x.product)})),['product','warehouse','qty'])}
else if(page==='Invoices'){h=table(S.Invoices.map(x=>({...x,outstanding:money(balance(x.id))})),['id','order','customer','total','outstanding'],r=>btn('Print','print',r.id))}
else if(page==='Payments'){h=form([field('invoice',S.Invoices),field('amount:number'),field('date:date'),field('mode'),field('reference')],'payment','Record payment')+table(S.Payments,['id','invoice','amount','date','mode','reference'])}
else if(page==='Installments'){h=form([field('invoice',S.Invoices),field('amount:number'),field('due:date')],'installment','Add installment')+table(S.Installments.map(x=>{let paid=S.Payments.filter(p=>p.invoice===x.invoice).reduce((a,p)=>a+p.amount,0);let prior=S.Installments.filter(p=>p.invoice===x.invoice&&(p.due<x.due||p.due===x.due&&S.Installments.indexOf(p)<S.Installments.indexOf(x))).reduce((a,p)=>a+p.amount,0);let pending=Math.max(0,x.amount-Math.max(0,paid-prior));return {...x,pending,status:pending===0?'Paid':x.due<today()?'Overdue':'Pending'}}),['id','invoice','due','amount','pending','status'])}
else if(page==='Returns'){h=form([field('invoice',S.Invoices),field('qty:number'),field('reason'),field('condition',[{id:'Saleable'},{id:'Damaged'}])],'return','Record return / credit')+table(S.Returns,['id','invoice','qty','amount','condition','reason'])}view.innerHTML=h;notice.innerHTML='';search.value='';if(page==='Dashboard'){let vals=[S.Invoices.reduce((a,x)=>a+x.total,0),S.Payments.reduce((a,x)=>a+x.amount,0),S.Invoices.reduce((a,x)=>a+balance(x.id),0)],max=Math.max(1,...vals);view.insertAdjacentHTML('beforeend','<section class=panel><h2>Financial overview</h2>'+vals.map((v,i)=>'<p>'+['Invoiced','Collected','Outstanding'][i]+' · '+money(v)+'</p><div class=track><div style="width:'+Math.max(0,v/max*100)+'%"></div></div>').join('')+'</section>')}}
async function transact(fn){if(busy)return;busy=true;let old=JSON.stringify(S);try{fn();await save()}catch(e){try{await load()}catch{S=JSON.parse(old);render()}notice.innerHTML='<p class="error">'+esc(e.message)+'</p>'}finally{busy=false}}
function addLine(){let div=document.createElement('div');div.className='grid extra';div.innerHTML=[field('product',S.Products),field('warehouse',S.Warehouses),field('qty:number'),field('rate:number'),field('discount:number'),field('gst:number')].join('')+'<button type="button" onclick="this.parentNode.remove()">Remove</button>';extraLines.append(div)}
function lines(x){return x.lines||[x]}
function submitForm(e,a){e.preventDefault();let d={};for(let x of e.target.querySelectorAll('input,select'))if(!x.closest('.extra'))d[x.name]=x.type==='number'?Number(x.value):x.value;let extras=[...e.target.querySelectorAll('.extra')].map(row=>Object.fromEntries([...row.querySelectorAll('input,select')].map(x=>[x.name,x.type==='number'?Number(x.value):x.value])));transact(()=>{let positive=n=>{if(!Number.isFinite(n)||n<=0)throw Error('Enter a positive amount or quantity')};if(a==='master'){if(page==='Products'&&S.Products.some(x=>x.sku===d.sku))throw Error('SKU already exists');S[page].push({...d,id:id(page.slice(0,3).toUpperCase())})}if(a==='trade'){positive(d.qty);positive(d.rate);if(d.discount>100||d.gst>100)throw Error('Invalid percentage');d.lines=[{product:d.product,warehouse:d.warehouse,qty:d.qty,rate:d.rate,discount:d.discount,gst:d.gst},...extras];for(let l of d.lines){positive(l.qty);positive(l.rate);if(l.discount>100||l.gst>100)throw Error('Invalid percentage');l.total=Math.round(l.qty*l.rate*(1-l.discount/100)*(1+l.gst/100)*100)/100}d.total=d.lines.reduce((a,l)=>a+l.total,0);S[page].push({...d,id:id(page==='Purchase'?'PO':page==='Quotation'?'QT':'SO'),status:page==='Purchase'?'Ordered':page==='Quotation'?'Draft':'Confirmed'})}if(a==='transfer'){positive(d.qty);if(d.from===d.to)throw Error('Select different warehouses');move(d.product,d.from,-d.qty);move(d.product,d.to,d.qty)}if(a==='payment'){positive(d.amount);if(d.amount>balance(d.invoice))throw Error('Payment exceeds outstanding');if(!d.date||!d.mode)throw Error('Date and mode required');S.Payments.push({...d,id:id('PAY')})}if(a==='installment'){positive(d.amount);let inv=S.Invoices.find(x=>x.id===d.invoice);if(!inv||!d.due)throw Error('Invoice and due date required');if(S.Installments.filter(x=>x.invoice===d.invoice).reduce((a,x)=>a+x.amount,0)+d.amount>inv.total)throw Error('Schedule exceeds invoice total');S.Installments.push({...d,id:id('INS')})}if(a==='return'){positive(d.qty);let inv=S.Invoices.find(x=>x.id===d.invoice);if(!inv)throw Error('Select invoice');if(lines(inv).length>1)throw Error('Multi-line returns require line allocation; not supported yet');let prev=S.Returns.filter(x=>x.invoice===d.invoice).reduce((a,x)=>a+x.qty,0);if(prev+d.qty>inv.qty)throw Error('Return exceeds sold quantity');d.amount=Math.round(inv.total/inv.qty*d.qty*100)/100;if(d.condition==='Saleable')move(inv.product,inv.warehouse,d.qty);S.Returns.push({...d,id:id('RET')})}})}
function action(a,i){if(a==='print'){let x=S.Invoices.find(x=>x.id===i);view.innerHTML=`<div class="panel"><h1>${esc(S.Organisation[0].name)}</h1><h2>Invoice ${esc(i)}</h2><p>Customer: ${esc(name('Customers',x.customer))}</p>${lines(x).map(l=>`<p>${esc(name('Products',l.product))} | Qty ${l.qty} | Rate ${money(l.rate)} | Discount ${l.discount}% | GST ${l.gst}%</p>`).join('')}<h2>Total: ${money(x.total)}</h2><p>Outstanding: ${money(balance(i))}</p><p>Training invoice — verify statutory fields before use.</p><button onclick="window.print()">Print / Save PDF</button> <button onclick="render()">Back</button></div>`;return}transact(()=>{let x=S[page].find(x=>x.id===i);if(!x)throw Error('Record not found');if(a==='convert'){if(x.status==='Converted')throw Error('Already converted');S.Customers.push({id:id('CUS'),name:x.name,phone:x.phone});x.status='Converted'}if(a==='receive'&&x.status==='Ordered'){for(let l of lines(x))move(l.product,l.warehouse,l.qty);x.status='Received'}if(a==='approve')x.status='Approved';if(a==='reject')x.status='Rejected';if(a==='order'&&x.status==='Approved'){S['Sales Orders'].push({...x,id:id('SO'),quotation:x.id,status:'Confirmed'});x.status='Converted'}if(a==='dispatch'&&x.status==='Confirmed'){for(let l of lines(x))move(l.product,l.warehouse,-l.qty);x.status='Dispatched'}if(a==='invoice'&&x.status==='Dispatched'){S.Invoices.push({...x,id:id('INV'),order:x.id,date:today()});x.status='Invoiced'}})}
async function createUser(e){e.preventDefault();let r=await fetch("/api/users",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(!r.ok){alert("Admin only; unique username and password of at least 12 characters required");return}render()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='practice-erp-export.json';a.click();URL.revokeObjectURL(a.href)}load().catch(()=>{});
</script></body></html>
